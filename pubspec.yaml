name: frenchly
description: "Bonjourney - Your personal French guide. Offline-first French learning app, A1 to C2."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  google_mobile_ads: ^9.1.0
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Build-time only: regenerates Android and iOS launcher icons from
  # assets/branding. Run `dart run flutter_launcher_icons` after changing
  # the artwork.
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#226EEB"
  # Full-bleed artwork: the generator already applies a 16% safe-zone inset.
  adaptive_icon_foreground: "assets/branding/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/content/a1/
    - assets/content/a2/
    - assets/content/b1/
    - assets/content/b2/
    - assets/content/c1/
    - assets/content/c2/
    - assets/content/videos.json
